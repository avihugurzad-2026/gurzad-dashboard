<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>כניסה — דשבורד בעלים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div>
      <h1 class="login-card__title">דשבורד בעלים</h1>
      <p class="login-card__sub">גישה מוגבלת לבעלים בלבד</p>
    </div>

    <div class="alert alert-error" id="errMsg" role="alert">
      <span class="alert__icon" aria-hidden="true">⚠</span>
      <span class="alert__text" id="errText"></span>
    </div>
    <div class="alert alert-success" id="okMsg" role="status">
      <span class="alert__icon" aria-hidden="true">✓</span>
      <span class="alert__text">כניסה בהצלחה...</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="pwd">סיסמה</label>
      <input
        class="form-input form-input--ltr"
        type="password"
        id="pwd"
        autocomplete="current-password"
        autofocus
      >
    </div>

    <button class="btn-primary w-full" id="btn" onclick="login()">כניסה</button>
  </div>

  <script>
    fetch('/api/kpi/home', { credentials: 'include' })
      .then(r => { if (r.ok) location.href = '/index.html'; })
      .catch(() => {});

    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const pwd = document.getElementById('pwd').value.trim();
      const err = document.getElementById('errMsg');
      const ok  = document.getElementById('okMsg');
      const btn = document.getElementById('btn');

      err.classList.remove('is-visible');
      ok.classList.remove('is-visible');
      if (!pwd) { showErr('הכנס סיסמה'); return; }

      btn.disabled = true;
      btn.textContent = '...מתחבר';

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();

        if (!res.ok) { showErr(data.error || 'שגיאה בהתחברות'); return; }

        ok.classList.add('is-visible');
        setTimeout(() => { location.href = '/index.html'; }, 600);
      } catch {
        showErr('שגיאה בחיבור לשרת');
      } finally {
        btn.disabled = false;
        btn.textContent = 'כניסה';
      }
    }

    function showErr(msg) {
      document.getElementById('errText').textContent = msg;
      document.getElementById('errMsg').classList.add('is-visible');
    }
  </script>
</body>
</html>
